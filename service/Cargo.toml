[package]
name = "turbo-fortnight"
version = "0.0.1"
edition = "2021"

[dependencies]
axum = "0.8.1"
tokio = { version = "1.43.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8.3", features = ["postgres", "runtime-tokio-native-tls", "uuid"] }
dotenv = "0.15"
uuid = { version = "1.0", features = ["serde", "v4"] }